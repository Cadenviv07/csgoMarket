[package]
    name = "trading_engine"
    version = "0.1.0"
    edition = "2021"

[dependencies]
    zmq = "0.10" 


    serde = { version = "1", features = ["derive"] } 



    serde_json = "1" 


    rusqlite = { version = "0.31", features = ["bundled"] } 

    chrono = { version = "0.4", features = ["serde"] } 



    tracing = "0.1" 

    tracing-subscriber = "0.3" 

    anyhow = "1" 